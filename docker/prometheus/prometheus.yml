global:
  scrape_interval: 30s
  scrape_timeout: 5s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [127.0.0.1:9090]
  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]
  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]
  - job_name: caddy
    static_configs:
      - targets: [caddy:9101]
  - job_name: cloudflared
    metrics_path: /cloudflared-metrics
    static_configs:
      - targets: [caddy:9101]
  - job_name: app-1
    metrics_path: /app-1-metrics
    static_configs:
      - targets: [caddy:9101]
  - job_name: app-2
    metrics_path: /app-2-metrics
    static_configs:
      - targets: [caddy:9101]
