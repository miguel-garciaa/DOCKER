global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [127.0.0.1:9090]

  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]

  - job_name: cloudflared
    static_configs:
      - targets: [cloudflared:2000]

  - job_name: caddy-gateway
    metrics_path: /internal/metrics
    static_configs:
      - targets: [gateway-metrics:8000]

  - job_name: caddy-metrics-gateway
    metrics_path: /internal/metrics
    static_configs:
      - targets: [metrics-gateway:9090]

  # Docker DNS devuelve una direccion por cada replica Laravel activa.
  - job_name: caddy-app
    metrics_path: /internal/metrics
    dns_sd_configs:
      - names: [web-backend]
        type: A
        port: 8000
        refresh_interval: 5s
