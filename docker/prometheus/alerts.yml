groups:
  - name: infrastructure
    rules:
      - alert: MetricsTargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus no puede consultar {{ $labels.job }}"
          description: "El target {{ $labels.instance }} lleva al menos 2 minutos sin responder."

      - alert: ContainerOomDetected
        expr: increase(container_oom_events_total{container_label_com_docker_compose_project!=""}[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Un contenedor ha sufrido un OOM"
          description: "Revisa memoria, swap y logs del servicio {{ $labels.container_label_com_docker_compose_service }}."

      - alert: LaravelReplicaCapacityLow
        expr: (sum(up{job=~"app-1|app-2"}) or vector(0)) < 2
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Hay menos de dos replicas Laravel disponibles"
          description: "Comprueba app-1, app-2, sus healthchecks y el balanceador."

      - alert: PrometheusRuleEvaluationFailures
        expr: increase(prometheus_rule_evaluation_failures_total[5m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Prometheus no puede evaluar alguna regla"
          description: "Comprueba las reglas y los logs de Prometheus."

      - alert: HostDiskAlmostFull
        expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes < 0.15
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Menos del 15% de espacio libre en {{ $labels.mountpoint }}"

      - alert: CloudflareTunnelDisconnected
        expr: cloudflared_tunnel_ha_connections == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "El conector ha perdido todas las conexiones con Cloudflare"

      - alert: BackupOverdue
        expr: time() - laravel_backup_last_success_timestamp_seconds > 90000 or absent(laravel_backup_last_success_timestamp_seconds)
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "Backup diario ausente o demasiado antiguo"

      - alert: BackupVerificationOverdue
        expr: time() - laravel_backup_check_last_success_timestamp_seconds > 691200 or absent(laravel_backup_check_last_success_timestamp_seconds)
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Falta una verificacion reciente del repositorio Restic"
