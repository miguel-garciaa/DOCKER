name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Prepare SQLite
        shell: bash
        run: touch database/database.sqlite

      - name: Setup Application
        run: composer setup

      - name: Validate deployment files
        shell: bash
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_PASSWORD: validation-only-password
          POSTGRES_PASSWORD: validation-only-password
          REDIS_PASSWORD: 0123456789abcdef0123456789abcdef
          RESEND_KEY: re_validation
          TUNNEL_TOKEN: validation-only-token
        run: |
          bash -n deploy.sh
          docker compose --env-file .env.example config --quiet

      - name: Run CI Checks
        run: composer ci:check

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@0a596b2e7a325f0cedf8e9bd21ab002cbd3c9241
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        id: image
        uses: docker/build-push-action@91670ba5a4df99a24efff8637a78c83fd1b0f6b1
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/miguel-garciaa/docker:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show immutable deployment reference
        shell: bash
        run: echo 'APP_IMAGE=ghcr.io/miguel-garciaa/docker@${{ steps.image.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
