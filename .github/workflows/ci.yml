name: Validate stack
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_PASSWORD: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      POSTGRES_PASSWORD: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      REDIS_PASSWORD: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
      RESEND_KEY: test
      TUNNEL_TOKEN: test
      METRICS_PASSWORD_HASH: '$2y$12$abcdefghijklmnopqrstuuABCDEFGHIJKLMNOPQRSTUVWXYZ01234'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, pdo_pgsql, intl, gd, bcmath, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: laravel/package-lock.json
      - name: Dependencies and application checks
        working-directory: laravel
        run: |
          cp .env.example .env
          composer install --no-interaction --prefer-dist
          php artisan key:generate
          npm ci
          composer run ci:check
      - name: Shell validation
        run: shellcheck setup-host.sh deploy.sh publish-image.sh docker/*.sh laravel/docker/entrypoint.sh
      - name: Build runtime and check contents
        run: |
          docker build --target runtime -t laravel-app:ci .
          docker compose --env-file .env.example build caddy
          docker run --rm --user 1000:1000 --cap-drop ALL --security-opt no-new-privileges:true \
            --entrypoint caddy laravel-caddy:local version
          docker run --rm --entrypoint sh laravel-app:ci -ec '
            test "$(id -un)" = www-data
            ! command -v node
            ! command -v npm
            ! command -v composer
            test ! -d /app/node_modules
            test ! -d /app/tests
            test ! -e /app/.env
            test ! -e /app/docker-compose.yml
            php --ri pdo_pgsql
            php --ri redis
          '
      - name: Proxy behavior and Prometheus validation
        run: |
          docker pull caddy:2.11.2-alpine
          id=$(docker create caddy:2.11.2-alpine)
          docker cp "$id:/usr/bin/caddy" /tmp/caddy
          docker rm "$id"
          chmod +x /tmp/caddy
          node laravel/tests/Infrastructure/proxy.mjs /tmp/caddy
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/docker/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.13.3-distroless check config /etc/prometheus/prometheus.yml
