name: ${COMPOSE_PROJECT_NAME:-laravel}

services:
  caddy:
    image: ${COMPOSE_PROJECT_NAME:-laravel}-caddy:local
    build:
      context: .
      # Quitar la file capability evita EPERM con cap_drop: ALL.
      dockerfile_inline: |
        FROM caddy:2.11.2-alpine
        RUN setcap -r /usr/bin/caddy
    pull_policy: never
    cgroup_parent: project-${COMPOSE_PROJECT_NAME:-laravel}.slice
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}
    user: "1000:1000"
    pids_limit: 128
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Falta APP_DOMAIN}
      METRICS_DOMAIN: ${METRICS_DOMAIN:?Falta METRICS_DOMAIN}
      METRICS_USERNAME: ${METRICS_USERNAME:-grafana}
      METRICS_PASSWORD_HASH: ${METRICS_PASSWORD_HASH:?Falta hash bcrypt}
      BLOCKED_IPS: ${BLOCKED_IPS:-0.0.0.0/32}
      XDG_CONFIG_HOME: /tmp/config
      XDG_DATA_HOME: /tmp/data
    entrypoint: [/bin/sh, /etc/caddy/start.sh]
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docker/caddy-start.sh:/etc/caddy/start.sh:ro
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=1770,size=32m
    networks: [edge, application, monitoring]
    depends_on:
      cloudflared: {condition: service_started}
      app-1: {condition: service_healthy}
      app-2: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:9101/health"]
      interval: 10s
      timeout: 3s
      retries: 6

  app-1:
    image: ${APP_IMAGE:-laravel-app:local}
    build:
      context: .
      target: runtime
    pull_policy: never
    cgroup_parent: project-${COMPOSE_PROJECT_NAME:-laravel}.slice
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}
    user: www-data
    init: true
    pids_limit: 256
    env_file: ./docker/app.env
    command: [web]
    volumes:
      - uploads:/app/storage/app
    tmpfs:
      - /tmp:uid=33,gid=33,mode=1770,size=128m
      - /app/bootstrap/cache:uid=33,gid=33,mode=0770,size=64m
      - /app/storage/framework:uid=33,gid=33,mode=0770,size=128m
      - /app/storage/logs:uid=33,gid=33,mode=0770,size=16m
    networks: [application, data]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    stop_grace_period: 75s
    healthcheck:
      test: [CMD, php, /app/docker/health.php]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  app-2:
    image: ${APP_IMAGE:-laravel-app:local}
    pull_policy: never
    cgroup_parent: project-${COMPOSE_PROJECT_NAME:-laravel}.slice
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}
    user: www-data
    init: true
    pids_limit: 256
    env_file: ./docker/app.env
    command: [web]
    volumes:
      - uploads:/app/storage/app
    tmpfs:
      - /tmp:uid=33,gid=33,mode=1770,size=128m
      - /app/bootstrap/cache:uid=33,gid=33,mode=0770,size=64m
      - /app/storage/framework:uid=33,gid=33,mode=0770,size=128m
      - /app/storage/logs:uid=33,gid=33,mode=0770,size=16m
    networks: [application, data]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    stop_grace_period: 75s
    healthcheck:
      test: [CMD, php, /app/docker/health.php]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  queue:
    image: ${APP_IMAGE:-laravel-app:local}
    pull_policy: never
    cgroup_parent: project-${COMPOSE_PROJECT_NAME:-laravel}.slice
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}
    user: www-data
    init: true
    pids_limit: 256
    env_file: ./docker/app.env
    command: [queue]
    volumes:
      - uploads:/app/storage/app
    tmpfs:
      - /tmp:uid=33,gid=33,mode=1770,size=128m
      - /app/bootstrap/cache:uid=33,gid=33,mode=0770,size=64m
      - /app/storage/framework:uid=33,gid=33,mode=0770,size=128m
      - /app/storage/logs:uid=33,gid=33,mode=0770,size=16m
    networks: [application, data]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    stop_grace_period: 75s


  postgres:
    image: postgres:18.3-bookworm
    cgroup_parent: project-${COMPOSE_PROJECT_NAME:-laravel}.slice
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}
    user: postgres
    pids_limit: 128
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      PGDATA: /var/lib/postgresql/18/docker
      DB_DATABASE: ${DB_DATABASE:-laravel}
      DB_USERNAME: ${DB_USERNAME:-laravel}
      DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD}
    command: [postgres, -c, max_connections=60, -c, shared_buffers=256MB, -c, huge_pages=off]
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-app.sh:ro
    tmpfs:
      - /tmp:mode=1777,size=64m
      - /var/run/postgresql:mode=1777,size=16m
    shm_size: 256m
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d postgres']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    stop_grace_period: 60s

  redis:
    image: redis:8.6.6-trixie
    cgroup_parent: project-${COMPOSE_PROJECT_NAME:-laravel}.slice
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}
    user: redis
    pids_limit: 64
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-256mb}
    entrypoint: [/bin/sh, /usr/local/etc/redis/start.sh]
    volumes:
      - redis_data:/data
      - ./docker/redis-start.sh:/usr/local/etc/redis/start.sh:ro
    tmpfs:
      - /tmp:mode=1777,size=16m
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -qx PONG']
      interval: 5s
      timeout: 3s
      retries: 12
    stop_grace_period: 30s

  cloudflared:
    image: cloudflare/cloudflared:2026.3.0
    cgroup_parent: project-${COMPOSE_PROJECT_NAME:-laravel}.slice
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}
    user: "65532:65532"
    pids_limit: 64
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Falta TUNNEL_TOKEN}
    command: [tunnel, --no-autoupdate, --metrics, "0.0.0.0:2000", run]
    networks: [edge]

  prometheus:
    image: prom/prometheus:v3.13.3-distroless
    cgroup_parent: project-${COMPOSE_PROJECT_NAME:-laravel}.slice
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}
    user: "65532:65532"
    init: true
    pids_limit: 128
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-7d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-2GB}
      - --web.listen-address=0.0.0.0:9090
      - --web.external-url=https://${METRICS_DOMAIN}
      - --query.max-concurrency=4
      - --query.timeout=30s
    volumes:
      - prometheus_data:/prometheus
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    tmpfs:
      - /tmp:uid=65532,gid=65532,mode=1770,size=32m
    networks: [monitoring]
    healthcheck:
      test: [CMD, /bin/promtool, check, ready]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    stop_grace_period: 30s

  node-exporter:
    image: prom/node-exporter:v1.12.0
    cgroup_parent: project-${COMPOSE_PROJECT_NAME:-laravel}.slice
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}
    user: "65534:65534"
    pid: host
    pids_limit: 64
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.textfile.directory=/host/var/lib/laravel-backup-status
      # La red del contenedor no representa la del host. Trafico: cAdvisor.
      - --no-collector.netdev
      - --no-collector.netstat
      - --no-collector.sockstat
      - --no-collector.arp
      - --no-collector.udp_queues
      - --no-collector.conntrack
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containerd/.+)($|/)
    volumes:
      - /:/host:ro,rslave
    networks: [monitoring]

  # Excepcion de confianza: el socket permite administrar Docker incluso montado :ro.
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5
    cgroup_parent: project-${COMPOSE_PROJECT_NAME:-laravel}.slice
    privileged: true
    cgroup: host
    restart: unless-stopped
    pids_limit: 128
    read_only: true
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    tmpfs:
      - /tmp:mode=1777,size=32m
    networks: [monitoring]
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}

networks:
  edge: {}
  application: {}
  data:
    internal: true
  monitoring:
    internal: true

volumes:
  postgres_data:
  redis_data:
  uploads:
  prometheus_data:
