name: ${COMPOSE_PROJECT_NAME:-laravel}

x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

x-service: &service
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging: *logging

x-laravel: &laravel
  <<: *service
  image: ${APP_IMAGE:-laravel-app:local}
  pull_policy: never
  user: www-data
  init: true
  pids_limit: 256
  env_file: ./docker/app.env
  volumes:
    - uploads:/app/storage/app
  tmpfs:
    - /tmp:uid=33,gid=33,mode=1770,size=128m
    - /app/bootstrap/cache:uid=33,gid=33,mode=0770,size=64m
    - /app/storage/framework:uid=33,gid=33,mode=0770,size=128m
    - /app/storage/logs:uid=33,gid=33,mode=0770,size=16m
  networks: [application, data]
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
  stop_grace_period: 75s

x-app-health: &app-health
  test: [CMD, php, /app/docker/health.php]
  interval: 10s
  timeout: 5s
  retries: 6
  start_period: 30s

services:
  nginx:
    <<: *service
    image: nginx:1.31.5-alpine
    user: "101:101"
    pids_limit: 128
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Falta APP_DOMAIN}
      METRICS_DOMAIN: ${METRICS_DOMAIN:?Falta METRICS_DOMAIN}
      METRICS_USERNAME: ${METRICS_USERNAME:-grafana}
      METRICS_PASSWORD_HASH: ${METRICS_PASSWORD_HASH:?Falta METRICS_PASSWORD_HASH}
    command:
      - /bin/sh
      - -c
      - |
        envsubst '$$APP_DOMAIN $$METRICS_DOMAIN' < /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf
        printf '%s:%s\n' "$$METRICS_USERNAME" "$$METRICS_PASSWORD_HASH" > /tmp/.htpasswd
        exec nginx -g 'daemon off;'
    volumes:
      - ./docker/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    tmpfs:
      - /etc/nginx/conf.d:uid=101,gid=101,mode=0755,size=4m
      - /var/cache/nginx:uid=101,gid=101,mode=0755,size=32m
      - /var/run:uid=101,gid=101,mode=0755,size=4m
      - /tmp:uid=101,gid=101,mode=0700,size=4m
    networks: [edge, application, monitoring]
    depends_on:
      cloudflared: {condition: service_started}
      app-1: {condition: service_healthy}
      app-2: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:9101/health"]
      interval: 10s
      timeout: 3s
      retries: 6

  app-1:
    <<: *laravel
    build:
      context: .
      target: runtime
    command: [web]
    healthcheck: *app-health

  app-2:
    <<: *laravel
    command: [web]
    healthcheck: *app-health

  queue:
    <<: *laravel
    command: [queue]

  postgres:
    <<: *service
    image: postgres:18.3-bookworm
    user: postgres
    pids_limit: 128
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      PGDATA: /var/lib/postgresql/18/docker
      DB_DATABASE: ${DB_DATABASE:-laravel}
      DB_USERNAME: ${DB_USERNAME:-laravel}
      DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD}
    command: [postgres, -c, max_connections=60, -c, shared_buffers=256MB]
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres.sh:/docker-entrypoint-initdb.d/10-app.sh:ro
    tmpfs:
      - /tmp:mode=1777,size=64m
      - /var/run/postgresql:mode=1777,size=16m
    shm_size: 256m
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d postgres']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    stop_grace_period: 60s

  redis:
    <<: *service
    image: redis:8.6.6-trixie
    user: redis
    pids_limit: 64
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Falta REDIS_PASSWORD}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-256mb}
    entrypoint: [/bin/sh, /usr/local/etc/redis/start.sh]
    volumes:
      - redis_data:/data
      - ./docker/redis.sh:/usr/local/etc/redis/start.sh:ro
    tmpfs:
      - /tmp:mode=1777,size=16m
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -qx PONG']
      interval: 5s
      timeout: 3s
      retries: 12
    stop_grace_period: 30s

  cloudflared:
    <<: *service
    image: cloudflare/cloudflared:2026.3.0
    user: "65532:65532"
    pids_limit: 64
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Falta TUNNEL_TOKEN}
    command: [tunnel, --no-autoupdate, --metrics, "0.0.0.0:2000", run]
    networks: [edge]

  prometheus:
    <<: *service
    image: prom/prometheus:v3.13.3-distroless
    user: "65532:65532"
    init: true
    pids_limit: 128
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-7d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-2GB}
      - --web.listen-address=0.0.0.0:9090
      - --web.external-url=https://${METRICS_DOMAIN}
      - --query.max-concurrency=4
      - --query.timeout=30s
    volumes:
      - prometheus_data:/prometheus
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    tmpfs:
      - /tmp:uid=65532,gid=65532,mode=1770,size=32m
    networks: [monitoring]
    healthcheck:
      test: [CMD, /bin/promtool, check, ready]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    stop_grace_period: 30s

  node-exporter:
    <<: *service
    image: prom/node-exporter:v1.12.0
    user: "65534:65534"
    pid: host
    pids_limit: 64
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.textfile.directory=/host/var/lib/laravel-backup-status
      - --no-collector.netdev
      - --no-collector.netstat
      - --no-collector.sockstat
      - --no-collector.arp
      - --no-collector.udp_queues
      - --no-collector.conntrack
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containerd/.+)($|/)
    volumes:
      - /:/host:ro,rslave
    networks: [monitoring]

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5
    privileged: true
    cgroup: host
    restart: unless-stopped
    read_only: true
    pids_limit: 128
    logging: *logging
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    tmpfs:
      - /tmp:mode=1777,size=32m
    networks: [monitoring]

networks:
  edge:
  application:
  data:
    internal: true
  monitoring:
    internal: true

volumes:
  postgres_data:
  redis_data:
  uploads:
  prometheus_data:
